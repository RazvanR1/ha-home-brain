name: Tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r ha_home_brain/requirements.txt pytest pytest-asyncio pyyaml
      - run: python -c "import yaml; yaml.safe_load(open('ha_home_brain/config.yaml'))"
      - run: pytest -q
