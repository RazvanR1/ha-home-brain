<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Home Brain</title>
<style>
  :root { --bg:#111418; --card:#1b2026; --line:#2a313a; --text:#e6e9ee; --muted:#8b95a3;
          --ok:#3fb27f; --warn:#e0a63a; --crit:#e5534b; --accent:#4c9aff; }
  * { box-sizing:border-box; }
  body { margin:0; font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
         background:var(--bg); color:var(--text); }
  main { max-width:980px; margin:0 auto; padding:16px; display:grid; gap:14px;
         grid-template-columns:repeat(auto-fit,minmax(300px,1fr)); }
  header { max-width:980px; margin:0 auto; padding:16px 16px 0; display:flex;
           align-items:center; gap:10px; }
  h1 { font-size:20px; margin:0; } h2 { font-size:14px; margin:0 0 10px; color:var(--muted);
           text-transform:uppercase; letter-spacing:.05em; }
  .dot { width:10px; height:10px; border-radius:50%; background:var(--muted); }
  .dot.ok { background:var(--ok); } .dot.bad { background:var(--crit); }
  section { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:14px; }
  .wide { grid-column:1/-1; }
  .item { padding:8px 0; border-top:1px solid var(--line); } .item:first-of-type { border-top:0; }
  .item small { color:var(--muted); display:block; }
  .warning { border-left:3px solid var(--warn); padding-left:8px; }
  .critical { border-left:3px solid var(--crit); padding-left:8px; }
  .info { border-left:3px solid var(--ok); padding-left:8px; }
  .off { color:var(--muted); }
  .empty { color:var(--muted); }
  #log { height:260px; overflow:auto; display:flex; flex-direction:column; gap:8px; margin-bottom:10px; }
  .msg { padding:8px 10px; border-radius:10px; max-width:85%; white-space:pre-wrap; }
  .me { align-self:flex-end; background:#24466f; } .bot { align-self:flex-start; background:#232a33; }
  form { display:flex; gap:8px; }
  input { flex:1; padding:10px; border-radius:8px; border:1px solid var(--line);
          background:#0d1014; color:var(--text); font:inherit; }
  button { padding:10px 14px; border:0; border-radius:8px; background:var(--accent);
           color:#fff; font:inherit; cursor:pointer; }
  button.ghost { background:transparent; border:1px solid var(--line); color:var(--muted); }
</style>
</head>
<body>
<header>
  <span id="conn" class="dot"></span><h1>Home Brain</h1>
  <span id="meta" style="color:var(--muted);margin-left:auto"></span>
</header>
<main>
  <section><h2>Alerte active</h2><div id="alerts"></div></section>
  <section><h2>Automatizări</h2><div id="rules"></div></section>
  <section class="wide"><h2>Jarvis</h2>
    <div id="log"></div>
    <form id="chat"><input id="q" placeholder="Întreabă ceva despre casă…" autocomplete="off">
      <button>Trimite</button></form>
  </section>
  <section class="wide"><h2>Istoric</h2><div id="history"></div>
    <p><button class="ghost" id="test">Trimite notificare de test</button></p></section>
</main>
<script>
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const when = t => new Date(t).toLocaleString("ro-RO");

function alertRow(a) {
  return `<div class="item ${esc(a.level)}">${esc(a.title)}<small>${esc(a.message)} · ${when(a.time)}</small></div>`;
}

async function refresh() {
  try {
    const s = await (await fetch("api/status")).json();
    $("conn").className = "dot " + (s.connected ? "ok" : "bad");
    $("meta").textContent = s.connected ? `${s.entities} entități` : "deconectat de la HA";
    $("alerts").innerHTML = s.active_alerts.length ? s.active_alerts.map(alertRow).join("")
      : '<div class="empty">Totul e în regulă.</div>';
    $("rules").innerHTML = s.automations.map(r =>
      `<div class="item ${r.enabled ? "" : "off"}">${esc(r.name)}
       <small>${r.enabled ? esc(r.last_action) : "neconfigurată"}</small></div>`).join("");
    $("history").innerHTML = s.history.length ? s.history.map(alertRow).join("")
      : '<div class="empty">Nimic încă.</div>';
    if (!s.assistant.enabled) $("q").placeholder = "Asistentul nu e configurat (ollama_url)";
  } catch (e) { $("conn").className = "dot bad"; }
}

function say(text, who) {
  const d = document.createElement("div");
  d.className = "msg " + who; d.textContent = text;
  $("log").appendChild(d); $("log").scrollTop = 1e9; return d;
}

$("chat").onsubmit = async e => {
  e.preventDefault();
  const q = $("q").value.trim(); if (!q) return;
  $("q").value = ""; say(q, "me");
  const wait = say("…", "bot");
  try {
    const r = await (await fetch("api/chat", {method:"POST", headers:{"Content-Type":"application/json"},
      body: JSON.stringify({message:q})})).json();
    let t = r.reply;
    if (r.actions?.length) t += "\n✓ " + r.actions.join("\n✓ ");
    if (r.refused?.length) t += "\n✗ " + r.refused.join("\n✗ ");
    wait.textContent = t;
  } catch (err) { wait.textContent = "Eroare: " + err; }
};

$("test").onclick = () => fetch("api/test-notify", {method:"POST"});
refresh(); setInterval(refresh, 10000);
</script>
</body>
</html>
