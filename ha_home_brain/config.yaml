name: Home Brain
version: "0.4.3"
slug: ha_home_brain
description: Creierul casei - învață obiceiurile, vede ce e neobișnuit, agenți AI locali, aprobări din telefon
url: https://github.com/RazvanR1/ha-home-brain
arch:
  - amd64
  - aarch64
init: false
startup: application
boot: auto
watchdog: "http://[HOST]:[PORT:8099]/api/health"
homeassistant_api: true
hassio_api: true
ingress: true
ingress_port: 8099
panel_icon: mdi:brain
panel_title: Home Brain
options:
  log_level: info
  time_zone: "Europe/Bucharest"
  site_context: ""
  notify_services: []
  ntfy_url: ""
  guard:
    unavailable_minutes: 30
    max_unavailable_hours: 24
    bad_states:
      - unavailable
    battery_threshold: 20
    interval_seconds: 60
    ignore: []
  learning:
    enabled: true
    persons: []
    history_import_days: 10
    min_support_days: 4
    min_confidence: 0.6
    propose_automations: true
    max_proposals_per_day: 2
  unusual:
    range: true
    silent: true
    flapping: true
    dwell: true
    open_away: false
    min_days: 5
    max_push_per_day: 5
    ignore: []
  safety:
    autonomy: copilot
    autonomy_overrides: []
    min_temperature: 16
    max_temperature: 26
    actionable_notifications: true
  agents:
    agents:
      - climate
      - energy
      - security
      - server
    agents_interval_hours: 6
    quiet_hours: "23-7"
    notify: digest
    digest_hour: 19
    allow_actions: false
  presence_camera:
    persons: []
    camera_switches: []
  heating_ac_lock:
    ac_climates: []
    boiler_climate: ""
  follow_thermostat:
    leader_climate: ""
    follower_climates: []
  assistant:
    ollama_url: ""
    model: "llama3.1:8b"
    allowed_domains:
      - light
      - switch
      - climate
      - cover
      - fan
      - media_player
      - scene
      - script
    max_entities: 150
    num_ctx: 8192
schema:
  log_level: list(debug|info|warning|error)
  time_zone: str
  site_context: str?
  notify_services:
    - str
  ntfy_url: str?
  guard:
    unavailable_minutes: int(1,)
    max_unavailable_hours: int(1,)
    bad_states:
      - str
    battery_threshold: int(0,100)
    interval_seconds: int(10,)
    ignore:
      - str
  learning:
    enabled: bool
    persons:
      - str
    history_import_days: int(1,60)
    min_support_days: int(2,30)
    min_confidence: float(0.3,1)
    propose_automations: bool
    max_proposals_per_day: int(0,20)
  unusual:
    range: bool
    silent: bool
    flapping: bool
    dwell: bool
    open_away: bool
    min_days: int(1,60)
    max_push_per_day: int(0,50)
    ignore:
      - str
  safety:
    autonomy: list(shadow|copilot|autonomous)
    autonomy_overrides:
      - str
    min_temperature: float
    max_temperature: float
    actionable_notifications: bool
  agents:
    agents:
      - list(climate|energy|security|server)
    agents_interval_hours: float(0.5,168)
    quiet_hours: str
    notify: list(none|digest|critical)
    digest_hour: int(0,23)
    allow_actions: bool
  presence_camera:
    persons:
      - str
    camera_switches:
      - str
  heating_ac_lock:
    ac_climates:
      - str
    boiler_climate: str?
  follow_thermostat:
    leader_climate: str?
    follower_climates:
      - str
  assistant:
    ollama_url: str?
    model: str
    allowed_domains:
      - str
    max_entities: int(20,2000)
    num_ctx: int(2048,131072)
